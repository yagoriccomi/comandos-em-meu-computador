<svg xmlns="http://www.w3.org/2000/svg" viewBox="46 22 420 420" width="420" height="420">
  <defs>
    <radialGradient id="fundo" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#2a1653"/>
      <stop offset="60%" stop-color="#120b2b"/>
      <stop offset="100%" stop-color="#07050f"/>
    </radialGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cfd2d8"/>
      <stop offset="50%" stop-color="#cfd2d8"/>
      <stop offset="100%" stop-color="#cfd2d8"/>
    </linearGradient>
    <linearGradient id="gabinete" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c1d26"/>
      <stop offset="100%" stop-color="#0d0e14"/>
    </linearGradient>
    <linearGradient id="vidro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2b30" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#16171b" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="desfoque"/>
      <feMerge><feMergeNode in="desfoque"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="brilhoForte" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- chifres do monstro -->
  <path d="M168 120 C150 84 156 52 176 34 C178 66 192 92 214 110 Z" fill="url(#rgb)"/>
  <path d="M344 120 C362 84 356 52 336 34 C334 66 320 92 298 110 Z" fill="url(#rgb)"/>

